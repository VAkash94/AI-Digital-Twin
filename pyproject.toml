[project]
name = "digital-twin"
version = "0.1.0"
description = "An AI digital twin that answers questions about my career, built with a hand-written agent loop (no agent framework)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "openai>=2.34.0",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
